[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-router"
version = "2.3.0"
description = "Enterprise Model Context Protocol (FastMCP / JSON-RPC 2.0 + SSE) Server, 120-Tool Hybrid BM25+Dense Router, Zero-Trust JWT RBAC/JSON Schema/Ticket-Bound HITL Governance Gate, Value Stream Management, sqlglot AST Guard, and OpenTelemetry Observability."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ahmed S. Ali", email = "ahmedshahrukhali@gmail.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "sqlglot>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
