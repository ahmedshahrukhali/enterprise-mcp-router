[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-router"
version = "2.2.0"
description = "Enterprise Model Context Protocol (FastMCP / JSON-RPC 2.0 + SSE) Server, 120-Tool Hybrid BM25+Dense Router, RBAC/JSON Schema/HITL Governance Gate, Value Stream Management (OKRs, Portfolios, Engineering Tickets), Cloud Data Connectors (Snowflake Cortex, Informatica IICS, SQLite/PostgreSQL), and Amazon Bedrock Observability."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ahmed S. Ali", email = "ahmedshahrukhali@gmail.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "sqlglot>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
