[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-router"
version = "2.1.0"
description = "Enterprise Model Context Protocol (FastMCP / JSON-RPC 2.0) Server, 105-Tool Semantic Router, RBAC/HITL Governance Gate, Cloud Data Connectors (Snowflake Cortex, Informatica IICS, PostgreSQL), and Amazon Bedrock / AgentCore Observability."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ahmed S. Ali", email = "ahmedshahrukhali@gmail.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
