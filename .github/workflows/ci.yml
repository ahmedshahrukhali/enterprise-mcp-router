name: Enterprise-MCP-Router CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies & security/lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit pytest-cov
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Type-check with Mypy
        run: mypy --ignore-missing-imports src
      - name: Dependency vulnerability audit
        run: pip-audit || true
      - name: Run Pytest suite with coverage
        run: pytest --cov=src -v
      - name: Run CLI Benchmark Simulation
        run: python run_demo.py
      - name: Build Docker image
        run: docker build -t enterprise-mcp-router:ci .
